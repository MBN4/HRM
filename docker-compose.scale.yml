# Phase 5.3 — a MANUAL, local demonstration of horizontal scaling: two
# api containers + one worker container, behind a bare-bones round-robin
# nginx load balancer, all sharing the SAME Postgres/Redis/MinIO this
# repo's main docker-compose.yml already runs. NOT part of the automated
# test suite (see apps/api/test/deployment-scaling.e2e-spec.ts for that)
# — this overlay is for a human to actually watch two containers alternate
# handling requests while auth/rate-limit/idempotency/circuit-breaker
# state stays correct, before deploying to a real cluster.
#
# Usage:
#   docker compose up -d postgres redis minio pgbouncer
#   pnpm --filter @hrm/db exec prisma migrate deploy
#   docker build -f apps/api/Dockerfile -t hrm/api:local .
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up api-1 api-2 worker lb
#   curl -H "Host: <slug>.yourhrms.local" http://localhost:8090/health/live
#
# (`docker compose up` alone still brings up ONLY the base infra — this
# file is additive and only takes effect when explicitly passed with `-f`.)

services:
  api-1:
    image: hrm/api:local
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgresql://hrm:hrm_dev_password@postgres:5432/hrm_dev?schema=public
      APP_DATABASE_URL: postgresql://hrm_app:hrm_app_dev_password@postgres:5432/hrm_dev?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_dev_secret
      JWT_REFRESH_SECRET: change_me_dev_refresh_secret
      PLATFORM_JWT_SECRET: change_me_dev_platform_secret
      PLATFORM_MODE_ENABLED: 'true'
      TENANT_BASE_DOMAIN: yourhrms.local
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: hrm_minio
      S3_SECRET_ACCESS_KEY: hrm_minio_password
      S3_BUCKET: hrm-dev
      S3_FORCE_PATH_STYLE: 'true'
      LICENSE_PUBLIC_KEY_PATH: ./keys/license-public-dev.pem
    depends_on:
      - postgres
      - redis

  api-2:
    image: hrm/api:local
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgresql://hrm:hrm_dev_password@postgres:5432/hrm_dev?schema=public
      APP_DATABASE_URL: postgresql://hrm_app:hrm_app_dev_password@postgres:5432/hrm_dev?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_dev_secret
      JWT_REFRESH_SECRET: change_me_dev_refresh_secret
      PLATFORM_JWT_SECRET: change_me_dev_platform_secret
      PLATFORM_MODE_ENABLED: 'true'
      TENANT_BASE_DOMAIN: yourhrms.local
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: hrm_minio
      S3_SECRET_ACCESS_KEY: hrm_minio_password
      S3_BUCKET: hrm-dev
      S3_FORCE_PATH_STYLE: 'true'
      LICENSE_PUBLIC_KEY_PATH: ./keys/license-public-dev.pem
    depends_on:
      - postgres
      - redis

  worker:
    image: hrm/api:local
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hrm:hrm_dev_password@postgres:5432/hrm_dev?schema=public
      APP_DATABASE_URL: postgresql://hrm_app:hrm_app_dev_password@postgres:5432/hrm_dev?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_dev_secret
      JWT_REFRESH_SECRET: change_me_dev_refresh_secret
      PLATFORM_JWT_SECRET: change_me_dev_platform_secret
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: hrm_minio
      S3_SECRET_ACCESS_KEY: hrm_minio_password
      S3_BUCKET: hrm-dev
      S3_FORCE_PATH_STYLE: 'true'
      LICENSE_PUBLIC_KEY_PATH: ./keys/license-public-dev.pem
    depends_on:
      - postgres
      - redis

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/lb/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Host port 8090, not 8080 — deliberately avoiding the common local
      # convention-over-8080 collision (a good reason to always check
      # `docker ps` for pre-existing host-port usage before picking one).
      - '8090:8080'
    depends_on:
      - api-1
      - api-2
