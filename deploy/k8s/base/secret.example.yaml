# Phase 5.3 — TEMPLATE ONLY. This file documents every secret key the api/
# worker Deployments require (`envFrom: secretRef: hrm-api-secrets`); it is
# NOT meant to be applied as-is in any real environment — every value below
# is a placeholder. In practice, populate `hrm-api-secrets` via whatever
# secret-management tooling the target cluster already uses (Sealed
# Secrets, External Secrets Operator + a real vault/KMS, `kubectl create
# secret generic --from-literal=... --from-env-file=...`, a managed
# platform's own secret store, ...) — never by committing real values into
# this repo. See docs/conventions/deployment-scaling.md § Kubernetes for
# the full topology this plugs into.
apiVersion: v1
kind: Secret
metadata:
  name: hrm-api-secrets
  namespace: hrm
type: Opaque
stringData:
  # --- Database (0.2/5.1) — APP_DATABASE_URL points at PgBouncer, not
  # Postgres directly, in any environment that runs the pooler (see
  # docs/conventions/scaling-data-layer.md § Connection pooling — the
  # `?pgbouncer=true` param is REQUIRED). DATABASE_URL (the owner role) is
  # used ONLY by the one-shot migration Job below, never by api/worker. ---
  DATABASE_URL: 'postgresql://hrm:CHANGE_ME@postgres-primary:5432/hrm_prod?schema=public'
  APP_DATABASE_URL: 'postgresql://hrm_app:CHANGE_ME@pgbouncer:6432/hrm_prod?schema=public&pgbouncer=true'
  # Optional/additive (5.1) — leave empty to route every read through the
  # primary, exactly like local dev's own default.
  APP_REPLICA_DATABASE_URL: ''

  # --- Redis (BullMQ + the 0.10 resilience chassis's shared state) ---
  REDIS_URL: 'redis://:CHANGE_ME@redis:6379'
  # Duplicates the password embedded in REDIS_URL above, as a discrete
  # value — KEDA's `redis` scaler (worker-hpa-keda.yaml) takes connection
  # params separately, not a connection string, so this is what its
  # `TriggerAuthentication` reads. Keep both in sync on rotation.
  REDIS_PASSWORD: 'CHANGE_ME'

  # --- Auth (0.4) — MUST differ from PLATFORM_JWT_SECRET below; a tenant
  # token must never be structurally able to verify as a platform token. ---
  JWT_SECRET: 'CHANGE_ME'
  JWT_REFRESH_SECRET: 'CHANGE_ME'

  # --- Platform / vendor console (4.1) ---
  PLATFORM_JWT_SECRET: 'CHANGE_ME'

  # --- Field-level encryption at rest (1.1) ---
  FIELD_ENCRYPTION_KEY: 'CHANGE_ME_BASE64_32_BYTES'

  # --- Object storage credentials (1.1) ---
  S3_ACCESS_KEY_ID: 'CHANGE_ME'
  S3_SECRET_ACCESS_KEY: 'CHANGE_ME'

  # --- Billing (4.2) — SaaS mode only; leave empty on an on-prem/lifetime
  # deployment (BillingModule binds MockStripeClient whenever unset,
  # exactly like local dev — see docs/conventions/billing.md). ---
  STRIPE_SECRET_KEY: ''
  STRIPE_WEBHOOK_SECRET: ''
