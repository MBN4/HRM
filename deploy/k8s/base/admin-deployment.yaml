# Phase 5.3 — the vendor super-admin console (apps/admin). No tenant
# subdomain concern (talks only to the @PlatformRoute() surface — see
# docs/conventions/vendor-console.md), so it gets its own fixed hostname
# at the ingress (admin.yourhrms.com) rather than sharing the tenant
# wildcard host portal/api do.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrm-admin
  namespace: hrm
  labels:
    app.kubernetes.io/name: hrm-admin
    app.kubernetes.io/part-of: hrm
    app.kubernetes.io/component: admin
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hrm-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hrm-admin
        app.kubernetes.io/part-of: hrm
        app.kubernetes.io/component: admin
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: admin
          image: hrm/admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - configMapRef:
                name: hrm-admin-config
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']
          livenessProbe:
            httpGet:
              path: /
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
---
apiVersion: v1
kind: Service
metadata:
  name: hrm-admin
  namespace: hrm
spec:
  selector:
    app.kubernetes.io/name: hrm-admin
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hrm-admin-config
  namespace: hrm
data:
  NODE_ENV: 'production'
  PORT: '3002'
  NEXT_PUBLIC_API_URL: 'https://admin.yourhrms.com/api'
  NEXT_PUBLIC_APP_ENV: 'production'
