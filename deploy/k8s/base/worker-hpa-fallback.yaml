# Phase 5.3 — a plain CPU-based HPA for the worker Deployment, for a
# cluster that does NOT run KEDA (see worker-hpa-keda.yaml for the
# preferred, queue-depth-based signal). Coarser — CPU usage lags actual
# queue backlog, since a worker under light CPU load can still have a
# deep backlog if jobs are I/O- or wait-bound — but works with zero extra
# cluster add-ons, so the worker Deployment is never left with NO
# autoscaling at all.
#
# Apply EITHER this file OR worker-hpa-keda.yaml, never both — the
# deploy/k8s/README.md documents which one a given environment should use.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hrm-worker
  namespace: hrm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hrm-worker
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
