# Phase 5.4 — Prometheus alerting rules for the key SLOs (latency, error
# rate, queue backlog, DB saturation, pool exhaustion). Plain Prometheus
# rule-file format (`rule_files:` in prometheus.yml, see
# docker-compose.observability.yml) — also wrappable as a k8s
# `PrometheusRule` CRD (see prometheus-rule.yaml in this same directory)
# for a cluster running the Prometheus Operator; the rule bodies are
# identical, only the envelope differs.
groups:
  - name: hrm-api-slo
    rules:
      - alert: HrmHighErrorRate
        expr: >
          100 * sum(rate(hrm_http_requests_total{status_code=~"5.."}[5m]))
          / sum(rate(hrm_http_requests_total[5m])) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'HRM API 5xx error rate above 5% for 5 minutes'
          description: '{{ $value | printf "%.1f" }}% of requests are failing with a 5xx status.'

      - alert: HrmHighLatencyP99
        expr: >
          histogram_quantile(0.99, sum(rate(hrm_http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'HRM API p99 latency above 2s for 10 minutes'
          description: 'p99 request latency is {{ $value | printf "%.2f" }}s.'

      - alert: HrmQueueBacklogGrowing
        expr: hrm_queue_depth{state="waiting"} > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'BullMQ queue "{{ $labels.queue }}" has over 500 waiting jobs for 10 minutes'
          description: 'Worker autoscaling (worker-hpa-keda.yaml) should already be reacting to this — if depth keeps climbing, check worker pod health/logs.'

      - alert: HrmQueueBacklogCritical
        expr: hrm_queue_depth{state="waiting"} > 5000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'BullMQ queue "{{ $labels.queue }}" has over 5000 waiting jobs — a genuine backlog, not just a burst'

      - alert: HrmDbPoolExhaustionFrequent
        expr: rate(hrm_db_pool_exhaustion_rejections_total[5m]) * 60 > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'DB connection-pool exhaustion (503s) occurring more than once/minute for 5 minutes'
          description: 'Consider raising DB_POOL_SIZE, adding read-replica routing for more reads (see scaling-data-layer.md), or scaling the api Deployment.'

      - alert: HrmCircuitBreakerOpen
        expr: hrm_circuit_breaker_state == 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Circuit breaker "{{ $labels.name }}" has been OPEN for 2+ minutes'
          description: 'The underlying dependency is failing fast — check the dependency''s own health, not just this alert.'

      - alert: HrmRateLimitRejectionsSpike
        expr: sum(rate(hrm_rate_limit_rejections_total[5m])) by (source) * 60 > 50
        for: 5m
        labels:
          severity: info
        annotations:
          summary: 'Rate-limit rejections (429s) from source "{{ $labels.source }}" exceeding 50/min for 5 minutes'
          description: 'Likely a single noisy tenant/API key hitting its quota, or a legitimate need to raise it — check the vendor console usage dashboard (4.1) for which tenant, then decide whether a per-tenant override (5.3/0.10) is warranted.'

      - alert: HrmLoadSheddingActive
        expr: sum(rate(hrm_load_shed_rejections_total[1m])) by (priority) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Load shedding is actively rejecting {{ $labels.priority }}-priority requests'
          description: 'The system is under enough load to shed non-critical traffic — this is 0.10''s protection working as designed, but sustained shedding means it''s time to scale out (check the api HPA, api-hpa.yaml).'

      - alert: HrmProcessDown
        expr: up{job=~"hrm-api|hrm-worker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'A {{ $labels.job }} target has been unreachable by Prometheus for 1 minute'
