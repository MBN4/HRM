# Phase 5.3 — a minimal round-robin load balancer for the LOCAL, manual
# multi-instance demo (docker-compose.scale.yml). Not used by any
# automated test (see apps/api/test/deployment-scaling.e2e-spec.ts for the
# actual automated multi-instance proof, which uses two in-process Nest
# application instances instead — a real docker-compose network is harder
# to drive from Jest, and adds nothing the in-process proof doesn't
# already establish about statelessness) — this is for a human to point a
# browser/curl at and watch requests actually land on alternating
# containers while still sharing rate-limit/idempotency/circuit-breaker
# state via Redis.
events {}

http {
  upstream hrm_api {
    server api-1:3001;
    server api-2:3001;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://hrm_api;
      proxy_set_header Host $http_host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Idempotency-Key $http_idempotency_key;
    }
  }
}
